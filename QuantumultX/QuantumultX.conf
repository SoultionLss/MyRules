# QuantumultX 主配置模板
# 由 scripts/generate.py 自动渲染规则段，其余部分可自由编辑
# 最后更新: 2026-08-19 10:56 UTC

[general]
dns_exclude_server = *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com
test_url = http://1.1.1.1/generate_204
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

[policy]
static=Global, 🚀 PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
static=Streaming, 🚀 PROXY, DIRECT, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
static=Google, 🚀 PROXY, DIRECT
static=AI, 🚀 PROXY, DIRECT
static=Social, 🚀 PROXY, DIRECT
static=Telegram, 🚀 PROXY, DIRECT
static=Spotify, 🚀 PROXY, DIRECT
static=Game, 🚀 PROXY, DIRECT
static=Emby, 🚀 PROXY, DIRECT
static=Final, 🚀 PROXY, DIRECT

[server_remote]
https://raw.githubusercontent.com/你的订阅链接, tag=节点, update-interval=86400

