name: Sync and Generate Rules

on:
  push:
    branches:
      - main
    paths:
      - 'config/my_rules.yaml'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_REPO: "SoultionLss/Rules"
  TARGET_BRANCH: "main"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Generate rules
        run: |
          cd scripts
          python generate.py

      - name: Generate config templates
        run: |
          cd scripts
          python config_builder.py

      - name: Push to target repository
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git target_repo
          cd target_repo
          git checkout ${TARGET_BRANCH} || git checkout -b ${TARGET_BRANCH}
          # 保留旧文件，仅覆盖更新的文件（使用 rsync 或 cp -u）
          # 这里我们直接覆盖整个平台目录，但保留未变更的文件
          rm -rf Surge Clash Egern v2ray
          cp -r ../dist/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update rules from source repo workflow [skip ci]"
            git push origin ${TARGET_BRANCH}
          fi
