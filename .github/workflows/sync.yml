name: Sync and Generate Rules

on:
  push:
    branches:
      - main
    paths:
      - 'config/my_rules.yaml'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_REPO: "SoultionLss/Rules"        # 目标规则仓库
  TARGET_BRANCH: "main"                   # 目标分支
  TARGET_DIR: "rules"                     # 目标目录

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (Rules branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Rules

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Generate rules
        run: |
          cd scripts
          python generate.py

      - name: Commit dist to current repo (test)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add -f dist/
          git diff --staged --quiet || git commit -m "chore: auto-update dist [skip ci]"
          git push origin Rules

      - name: Push to target repository
        env:
          TARGET_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git target_repo
          cd target_repo
          git checkout ${TARGET_BRANCH} || git checkout -b ${TARGET_BRANCH}
          rm -rf ${TARGET_DIR}
          cp -r ../dist ${TARGET_DIR}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${TARGET_DIR}
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update rules from source repo workflow [skip ci]"
            git push origin ${TARGET_BRANCH}
          fi
