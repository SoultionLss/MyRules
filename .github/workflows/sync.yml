name: Sync and Generate Rules

on:
  # 新增：当 Rules 分支上的 my_rules.yaml 发生变化时触发
  push:
    branches:
      - Rules
    paths:
      - 'config/my_rules.yaml'

  # 保留原有的定时触发（每天 UTC 12:00）
  schedule:
    - cron: '0 12 * * *'

  # 保留手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rules branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Rules

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Generate rules
        run: |
          cd scripts
          python generate.py

      # - name: Generate config templates
      #   run: |
      #     cd scripts
      #     python config_builder.py

      - name: Commit and push to Rules branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add -f dist/
          git add templates/
          git diff --staged --quiet || git commit -m "chore: auto-update rules and templates [skip ci]"
          git push origin Rules
