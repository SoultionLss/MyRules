name: auto-sync-rules

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: sync-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate rules
        run: python scripts/generate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "NO_CHANGES=1" >> "$GITHUB_OUTPUT" || true
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "auto: update rules $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
