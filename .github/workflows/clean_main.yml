name: Clean Main Branch

on:
  schedule:
    - cron: '0 0 * * 0'     # 每周日 00:00 UTC 执行
  workflow_dispatch:         # 支持手动触发

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main          # 切换到 main 分支

      - name: Clear all files except README and .gitignore
        run: |
          # 删除所有文件，保留 .git 目录
          git rm -rf --ignore-unmatch .
          # 重新创建一个干净的 README（可选）
          echo "# MyRules" > README.md
          echo "" >> README.md
          echo "This branch is intentionally kept clean. Please use the 'Rules' branch for all rule files and configurations." >> README.md
          # 保留 .gitignore（如果存在则保留，否则新建一个）
          if [ ! -f .gitignore ]; then
            echo "dist/" > .gitignore
            echo "__pycache__/" >> .gitignore
          fi

      - name: Commit and push clean state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add README.md .gitignore
          git diff --staged --quiet || git commit -m "chore: clean main branch [skip ci]"
          git push origin main --force   # 使用 --force 强制覆盖远程 main 分支
