name: Aggregate and Merge Rules

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Clone upstream repositories (shallow clone)
        run: |
          mkdir -p raw_rules
          git clone --depth 1 https://github.com/xkww3n/Rules.git raw_rules/xkww3n
          git clone --depth 1 https://github.com/blackmatrix7/ios_rule_script.git raw_rules/blackmatrix7
          git clone --depth 1 https://github.com/QuixoticHeart/rule-set.git raw_rules/quixoticheart
          git clone --depth 1 https://github.com/Loyalsoldier/clash-rules.git raw_rules/loyalsoldier
          git clone --depth 1 https://github.com/DustinWin/ruleset_geodata.git raw_rules/dustinwin
          git clone --depth 1 https://github.com/ACL4SSR/ACL4SSR.git raw_rules/acl4ssr

      - name: Run merge script
        run: python scripts/merge_rules.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/merged/
          git diff --staged --quiet || git commit -m "chore: auto-merge rules [skip ci]"
          git push
