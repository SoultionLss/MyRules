# Surge 主配置模板
# 由 scripts/generate.py 自动渲染规则段，其余部分可自由编辑
# 最后更新: {{RULES_TIMESTAMP}}

[General]
loglevel = notify
dns-server = 223.5.5.5, 119.29.29.29, system
exclude-simple-hostnames = true
always-real-ip = *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com
internet-test-url = http://1.1.1.1/generate_204
proxy-test-url = http://www.gstatic.com/generate_204

[Proxy]
DIRECT = direct
REJECT = reject
PROXY = placeholder, ss, your-server.example.com, 8388, encrypt-method=aes-256-gcm, password=your-password

[Proxy Group]
Global = select, PROXY, DIRECT
Streaming = select, PROXY, DIRECT
Google = select, PROXY, DIRECT
AI = select, PROXY, DIRECT
Social = select, PROXY, DIRECT
Telegram = select, PROXY, DIRECT
Spotify = select, PROXY, DIRECT
Game = select, PROXY, DIRECT
Emby = select, PROXY, DIRECT
Final = select, PROXY, DIRECT
PROXY = url-test, PROXY, url=http://1.1.1.1/generate_204, interval=300

{{RULES}}

[MITM]
hostname = %APPEND% *
