# ============================================================
#  Egern 核心配置模板（无脚本/模块）
#  适用版本 ≥ v2.20.0(772)
# ============================================================
#
# 【核心功能】
#   - 三层策略组体系（故障转移 + 智能测速 + 手动选择）
#   - 国内直连规则（Accademia 修正版 ChinaMax）
#   - 海外 AI / PikPak / YouTube 等精细化分流
#   - 独立策略组（GitHub / TikTok / YouTube / Telegram 等）
#   - Apple / Microsoft / Google 服务分流
#   - 全部规则集通过 jsDelivr CDN 加速
#
# 【作者】Soultion
# 【最后更新】2026-08-20
# ============================================================

http_port: 6152
socks_port: 6153
vif_only: true
hijack_dns:
  - '*:53'

geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country-without-asn.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb

proxy_latency_test_url: http://1.1.1.1/generate_204
direct_latency_test_url: http://wifi.vivo.com.cn/generate_204

dns:
  bootstrap:
    - system
  upstreams:
    Domestic-DNS:
      - 223.5.5.5
      - 119.29.29.29
    Domestic-Encrypted-DNS:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    Foreign-Encrypted-DNS:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
  forward:
    - proxy_rule_set:
        match: https://cdn.jsdelivr.net/gh/Repcz/Tool@X/Egern/Rules/Reject.yaml
        value: REJECT
        disabled: false
    - proxy_rule_set:
        match: https://cdn.jsdelivr.net/gh/Accademia/Additional_Rule_For_Clash@master/GeositeCN/GeositeCN.yaml
        value: Domestic-DNS
        disabled: false
    - domain_wildcard:
        match: '*'
        value: Domestic-Encrypted-DNS
        disabled: false
  hosts:
    dns.google:
      - 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844
    cloudflare-dns.com:
      - 104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9
    dns.alidns.com:
      - 223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1
    doh.pub:
      - 1.12.12.12, 120.53.53.53
    dot.pub:
      - 1.12.12.12, 120.53.53.53
  proxy_nameservers:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

real_ip_domains:
  - lancache.steamcontent.com
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - '*.srv.nintendo.net'
  - '*.stun.playstation.net'
  - xbox.*.microsoft.com
  - '*.xboxlive.com'
  - '*.logon.battlenet.com.cn'
  - '*.logon.battle.net'
  - stun.l.google.com
  - easy-login.10099.com.cn
  - '*-update.xoyocdn.com'
  - '*.prod.cloud.netflix.com'
  - appboot.netflix.com
  - '*-appboot.netflix.com'

mitm:
  enabled: true
  hostnames:
    includes:
      - weather-data.apple.com
      - weather-analytics-events.apple.com
      - pluginhub.kelee.one
      - hub.kelee.one
      - surge.qingr.moe
      - t.me
      - telegram.me

# ============================================================
# 策略组定义（policy_groups）- 保持您原有的完整配置
# ============================================================

policy_groups:
  # 此处保留您原有的所有 policy_groups 定义
  # （External、手动选择、智能测速、故障转移、业务策略组）
  # 内容较多，请从原 Soultion.yaml 中完整复制
  - name: 良心云
      type: select
      urls:
        - "YOUR_良心云_SUBSCRIPTION_URL"

  - name: 宝可梦
      type: select
      urls:
        - "YOUR_宝可梦_SUBSCRIPTION_URL"


  # ----------------------------------------------------------
  # 独立拼车订阅
  # 注意：
  # 拼车不是地区节点池成员
  # 必须经过上一跳
  # ----------------------------------------------------------

  - name: 美国拼车
      type: select
      urls:
        - "YOUR_US_SUBSCRIPTION_URL"
      prev_hop: 🇺🇸 美国-故选

  - name: 香港拼车
      type: select
      urls:
        - "YOUR_HK_SUBSCRIPTION_URL"
      prev_hop: 🇭🇰 香港-故选


  # ==========================================================
  # 地区手选
  # 来源：良心云 + 宝可梦
  # 不包含美国拼车 / 香港拼车
  # ==========================================================

  - name: 🇭🇰 香港-手选
      type: select
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇭🇰|香港|(\b(HK|Hong|HongKong)\b)'

  - name: 🇹🇼 台湾-手选
      type: select
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇹🇼|台湾|台北|(\b(TW|Tai|Taiwan)\b)'

  - name: 🇯🇵 日本-手选
      type: select
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇯🇵|日本|东京|大阪|(\b(JP|Japan)\b)'

  - name: 🇺🇸 美国-手选
      type: select
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇺🇸|美国|洛杉矶|圣何塞|纽约|(\b(US|United States)\b)'

  - name: 🇸🇬 狮城-手选
      type: select
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇸🇬|新加坡|狮城|(\b(SG|Singapore)\b)'


  # ==========================================================
  # 地区智能
  # hidden: true
  # ==========================================================

  - name: 🇭🇰 香港-智能
      type: auto_test
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇭🇰|香港|(\b(HK|Hong|HongKong)\b)'
      interval: 300
      timeout: 5
      hidden: true

  - name: 🇹🇼 台湾-智能
      type: auto_test
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇹🇼|台湾|(\b(TW|Tai|Taiwan)\b)'
      interval: 300
      timeout: 5
      hidden: true

  - name: 🇯🇵 日本-智能
      type: auto_test
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇯🇵|日本|东京|大阪|(\b(JP|Japan)\b)'
      interval: 300
      timeout: 5
      hidden: true

  - name: 🇺🇸 美国-智能
      type: auto_test
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇺🇸|美国|洛杉矶|圣何塞|纽约|(\b(US|United States)\b)'
      interval: 300
      timeout: 5
      hidden: true

  - name: 🇸🇬 狮城-智能
      type: auto_test
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)🇸🇬|新加坡|狮城|(\b(SG|Singapore)\b)'
      interval: 300
      timeout: 5
      hidden: true


  # ==========================================================
  # 地区故选
  # 手选正常时使用手选
  # 手选不可用时自动转智能
  # ==========================================================

  - name: 🇭🇰 香港-故选
      type: fallback
      policies:
        - 🇭🇰 香港-手选
        - 🇭🇰 香港-智能
      interval: 300
      timeout: 5

  - name: 🇹🇼 台湾-故选
      type: fallback
      policies:
        - 🇹🇼 台湾-手选
        - 🇹🇼 台湾-智能
      interval: 300
      timeout: 5

  - name: 🇯🇵 日本-故选
      type: fallback
      policies:
        - 🇯🇵 日本-手选
        - 🇯🇵 日本-智能
      interval: 300
      timeout: 5

  - name: 🇺🇸 美国-故选
      type: fallback
      policies:
        - 🇺🇸 美国-手选
        - 🇺🇸 美国-智能
      interval: 300
      timeout: 5

  - name: 🇸🇬 狮城-故选
      type: fallback
      policies:
        - 🇸🇬 狮城-手选
        - 🇸🇬 狮城-智能
      interval: 300
      timeout: 5


  # ==========================================================
  # 低倍率
  # 0.1 ～ 0.9
  # ==========================================================

  - name: 低倍率-手选
      type: select
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)低倍|0\.[1-9](?:x|倍)?|\b(LR|Low)\b'

  - name: 低倍率-智能
      type: auto_test
      policies:
        - 良心云
        - 宝可梦
      flatten: true
      filter: '(?i)低倍|0\.[1-9](?:x|倍)?|\b(LR|Low)\b'
      interval: 300
      timeout: 5
      hidden: true

  - name: 低倍率-故选
      type: fallback
      policies:
        - 低倍率-手选
        - 低倍率-智能
      interval: 300
      timeout: 5


  # ==========================================================
  # 最终兜底
  #
  # 必须放在策略组定义的最后
  # ==========================================================

  - name: 兜底节点
      type: select
      policies:
        - 🇭🇰 香港-故选
        - 🇯🇵 日本-故选
        - 🇺🇸 美国-故选
        - 🇸🇬 狮城-故选
        - 🇹🇼 台湾-故选
        - 低倍率-故选
        - 美国拼车
        - 香港拼车
        - DIRECT  
# ============================================================
# 规则定义（rules）- 保持您原有的完整配置
# ============================================================

rules:
  # 此处保留您原有的所有规则定义
  # 从 8.1 广告拦截 到 8.16 默认兜底
  # 内容较多，请从原 Soultion.yaml 中完整复制
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Advertising/Advertising.list
      policy: REJECT

  # -------- 8.2 抖音 vs TikTok --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/DouYin/DouYin.list
      policy: DIRECT

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/TikTok/TikTok.list
      policy: TikTok

  # -------- 8.3 Apple 服务 --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/apple.txt
      policy: DIRECT

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Apple/Apple.list
      policy: Global

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Apple/AppleTV.list
      policy: Streaming
      disabled: false

  # -------- 8.4 微软服务 --------
  - domain:
      match: 'copilot.microsoft.com'
      policy: AI
  - domain:
      match: 'api.microsoftapp.net'
      policy: AI
  - domain:
      match: 'copilot.azure.com'
      policy: AI
  - domain:
      match: 'openai.azure.com'
      policy: AI
  - domain:
      match: 'edgeservices.bing.com'
      policy: AI
  - domain:
      match: 'sydney.bing.com'
      policy: AI
  - domain:
      match: 'img.bing.com'
      policy: AI

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Microsoft/Microsoft.list
      policy: Microsoft

  - domain:
      match: 'cn.bing.com'
      policy: DIRECT
  - domain:
      match: '*.cn.bing.com'
      policy: DIRECT

  # -------- 8.5 GitHub --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/GitHub/GitHub.list
      policy: GitHub

  # -------- 8.6 Telegram --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Telegram/Telegram.list
      policy: Telegram

  # -------- 8.7 香港常用软件 --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/WhatsApp/WhatsApp.list
      policy: HongKongSocial

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Line/Line.list
      policy: HongKongSocial

  # -------- 8.8 社交媒体 --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Instagram/Instagram.list
      policy: Social

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Threads/Threads.list
      policy: Social

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Twitter/Twitter.list
      policy: Social

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Reddit/Reddit.list
      policy: Social

  # -------- 8.9 流媒体 --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Netflix/Netflix.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Disney/Disney.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/HBO/HBO.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/PrimeVideo/PrimeVideo.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Hulu/Hulu.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Peacock/Peacock.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Crunchyroll/Crunchyroll.list
      policy: Streaming

  # -------- 8.10 Google --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Google/Google.list
      policy: Google

  # -------- 8.11 YouTube --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/YouTube/YouTube.list
      policy: YouTube

  - user_agent:
      match: 'yt-dlp|youtube-dl'
      policy: DIRECT

  # -------- 8.12 海外网盘 --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/PikPak/PikPak.list
      policy: DIRECT
      disabled: true

  - domain:
      match: 'access.pikpakdrive.com'
      policy: REJECT
  - domain:
      match: 'access.mypikpak.com'
      policy: REJECT
  - domain:
      match: 'access.mypikpak.net'
      policy: REJECT
  - domain:
      match: 'access.pikpak.me'
      policy: REJECT

  - domain_keyword:
      match: 'dl-a10b-'
      policy: DIRECT
  - domain_keyword:
      match: 'dl-z01a-'
      policy: DIRECT
  - domain_regex:
      match: '^dl-[A-Za-z0-9-]+\.mypikpak\.com$'
      policy: DIRECT

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Baidu/Baidu.list
      policy: Global

  # -------- 8.13 海外 AI --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/viewer12/OverseasAI.list@main/rule/Egern/OverseasAI/OverseasAI.yaml
      policy: AI

  # -------- 8.14 国内域名 & IP --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/Accademia/Additional_Rule_For_Clash@master/GeositeCN/ChinaMax_Domain.yaml
      policy: DIRECT

  # -------- 8.15 局域网 --------
  - rule_set:
      match: https://cdn.jsdelivr.net/gh/Repcz/Tool@X/Egern/Rules/Lan.yaml
      policy: DIRECT

  # -------- 8.16 默认兜底 --------
  - default:
      policy: Final
