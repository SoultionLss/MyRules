- auto_test:
    name: HongKong
    policies:
    - Manual
    flatten: true
    filter: (?i)🇭🇰|香港|(\b(HK|Hong)\b)
    tolerance: 0
- auto_test:
    name: United States
    policies:
    - Manual
    flatten: true
    filter: (?i)🇺🇸|美国|洛杉矶|圣何塞|(\b(US|United States)\b)
    tolerance: 0
- auto_test:
    name: Singapore
    policies:
    - Manual
    flatten: true
    filter: (?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)\b)
    tolerance: 0
- auto_test:
    name: Japan
    policies:
    - Manual
    flatten: true
    filter: (?i)🇯🇵|日本|东京|(\b(JP|Japan)\b)
    tolerance: 0
- auto_test:
    name: Taiwan
    policies:
    - Manual
    flatten: true
    filter: (?i)🇨🇳|🇹🇼|台湾|(\b(TW|Tai|Taiwan)\b)
    tolerance: 0
