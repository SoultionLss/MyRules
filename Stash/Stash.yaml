# mihomo / Stash / Surfboard 通用主配置模板
# 由 scripts/generate.py 自动渲染规则段，其余部分可自由编辑
# 最后更新: 2026-08-19 14:30 UTC

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: "节点1"
    type: ss
    server: your-server.example.com
    port: 8388
    cipher: aes-256-gcm
    password: "your-password"

proxy-groups:
  - name: Global
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Streaming
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Google
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: AI
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Social
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Telegram
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Spotify
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Game
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Emby
    type: select
    proxies:
      - "节点1"
      - DIRECT
  - name: Final
    type: select
    proxies:
      - "节点1"
      - DIRECT

