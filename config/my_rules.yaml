    policy: HongKongBanking
    merge_group: HongKongBanking

# ============================================================
# 优先级 12：其他香港银行
# 来源: lingjingmaster:HK_Banks_Direct + Bwy999:HKBank
# 策略: HongKongBanking（DIRECT）
# ============================================================
- rule_set:
    match: lingjingmaster:HK_Banks_Direct
    policy: HongKongBanking
    merge_group: HongKongBanking

- rule_set:
    match: https://raw.githubusercontent.com/Bwy999/Surge/fe4d122f120932bb2a40e4c992871c4ec89eb788/Ruleset/HKBank.list
    policy: HongKongBanking
    merge_group: HongKongBanking

