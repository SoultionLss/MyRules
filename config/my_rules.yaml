# ============================================================
# 分流规则配置文件
# 规则从上到下依次匹配，优先级逐行递减
#
# 【字段说明】
#   match: 规则源标识，格式为 "来源名:规则名" 或完整 URL
#   policy: 策略组名称（合集名称/策略组名称）
#   merge_group: 可选字段，指定合并到哪个合集
#                - 有 merge_group: 该规则源合并到指定合集
#                - 无 merge_group: 该规则源作为独立源
# ============================================================

# ============================================================
# 优先级 1：DNS 防泄露
# 来源: blackmatrix7:BlockHttpDNS
# 策略: REJECT
# ============================================================
- rule_set:
    match: blackmatrix7:BlockHttpDNS
    policy: REJECT
    merge_group: REJECT

# ============================================================
# 优先级 2：谷歌服务（含 Gemini）
# 来源: blackmatrix7:Google + blackmatrix7:Gemini
# 策略: Google（日本节点，可手动切香港节点）
# ============================================================
- rule_set:
    match: blackmatrix7:Google
    policy: Google
    merge_group: Google

- rule_set:
    match: blackmatrix7:Gemini
    policy: Google
    merge_group: Google

# ============================================================
# 优先级 3：AI 服务
# 来源: blackmatrix7:OpenAI + blackmatrix7:Claude + blackmatrix7:xAI + blackmatrix7:Anthropic
# 策略: AI（美国节点）
# ============================================================
- rule_set:
    match: blackmatrix7:OpenAI
    policy: AI
    merge_group: AI

- rule_set:
    match: blackmatrix7:Claude
    policy: AI
    merge_group: AI

- rule_set:
    match: blackmatrix7:xAI
    policy: AI
    merge_group: AI

- rule_set:
    match: blackmatrix7:Anthropic
    policy: AI
    merge_group: AI

# ============================================================
# 抖音服务
# 来源: blackmatrix7:DouYin
# 策略: DIRECT
# ============================================================
- rule_set:
    match: blackmatrix7:DouYin
    policy: DIRECT

# ============================================================
# TikTok
# 来源: blackmatrix7:TikTok
# 策略: TikTok（美国故选）
# ============================================================
- rule_set:
    match: blackmatrix7:TikTok
    policy: TikTok
    merge_group: TikTok

# ============================================================
# 流媒体
# 来源: blackmatrix7:Netflix/Disney/HBO/PrimeVideo/Hulu/Peacock + HotKids:Crunchyroll
# 策略: Streaming（美国故选）
# ============================================================
- rule_set:
    match: blackmatrix7:Netflix
    policy: Streaming
    merge_group: Streaming

- rule_set:
    match: blackmatrix7:Disney
    policy: Streaming
    merge_group: Streaming

- rule_set:
    match: blackmatrix7:HBO
    policy: Streaming
    merge_group: Streaming

- rule_set:
    match: blackmatrix7:PrimeVideo
    policy: Streaming
    merge_group: Streaming

- rule_set:
    match: blackmatrix7:Hulu
    policy: Streaming
    merge_group: Streaming

- rule_set:
    match: blackmatrix7:Peacock
    policy: Streaming
    merge_group: Streaming

- rule_set:
    match: https://raw.githubusercontent.com/HotKids/Rules/a06feb8eb0bfc42a406f738806a122a50e2b144f/Surge/RULE-SET/Crunchyroll.list
    policy: Streaming
    merge_group: Streaming

# ============================================================
# Social 社交媒体
# 来源: blackmatrix7:Twitter/Instagram/Threads/Reddit
# 策略: Social（美国故选）
# ============================================================
- rule_set:
    match: blackmatrix7:Twitter
    policy: Social
    merge_group: Social

- rule_set:
    match: blackmatrix7:Instagram
    policy: Social
    merge_group: Social

- rule_set:
    match: blackmatrix7:Threads
    policy: Social
    merge_group: Social

- rule_set:
    match: blackmatrix7:Reddit
    policy: Social
    merge_group: Social

# ============================================================
# 优先级 4：YouTube（含翻译 API）
# 来源: blackmatrix7:YouTube
# 策略: YouTube（节点选择）
# ============================================================
- rule_set:
    match: blackmatrix7:YouTube
    policy: YouTube
    merge_group: YouTube

# ============================================================
# 优先级 5：哔哩哔哩
# 来源: blackmatrix7:BiliBili
# 策略: DIRECT
# ============================================================
- rule_set:
    match: blackmatrix7:BiliBili
    policy: DIRECT

# ============================================================
# 优先级 6：私有网络/局域网
# 来源: repcz:Egern/Rules/Lan
# 策略: DIRECT
# ============================================================
- rule_set:
    match: repcz:Egern/Rules/Lan
    policy: DIRECT

# ============================================================
# 优先级 7：Telegram
# 来源: blackmatrix7:Telegram
# 策略: Telegram（美国故选）
# ============================================================
- rule_set:
    match: blackmatrix7:Telegram
    policy: Telegram
    merge_group: Telegram

# ============================================================
# 优先级 8：代码托管（GitHub/GitLab/Atlassian）
# 来源: blackmatrix7:GitHub/GitLab/Atlassian
# 策略: GitHub
# ============================================================
- rule_set:
    match: blackmatrix7:GitHub
    policy: GitHub
    merge_group: GitHub

- rule_set:
    match: blackmatrix7:GitLab
    policy: GitHub
    merge_group: GitHub

- rule_set:
    match: blackmatrix7:Atlassian
    policy: GitHub
    merge_group: GitHub

# ============================================================
# Cloudflare（独立规则源，与 GitHub 策略组并列）
# 来源: blackmatrix7:Cloudflare
# 策略: GitHub
# ============================================================
- rule_set:
    match: blackmatrix7:Cloudflare
    policy: GitHub

# ============================================================
# 优先级 9：微软服务（bing.cn 直连）
# 来源: blackmatrix7:Microsoft
# 策略: Microsoft（DIRECT）
# ============================================================
- rule_set:
    match: blackmatrix7:Microsoft
    policy: Microsoft
    merge_group: Microsoft

# 微软中国直连
- domain:
    match: cn.bing.com
    policy: DIRECT

- domain:
    match: '*.cn.bing.com'
    policy: DIRECT

# ============================================================
# 优先级 10：HongKongSocial（WhatsApp/Line）
# 来源: blackmatrix7:Whatsapp/Line
# 策略: HongKongSocial（香港故选）
# ============================================================
- rule_set:
    match: blackmatrix7:Whatsapp
    policy: HongKongSocial
    merge_group: HongKongSocial

- rule_set:
    match: blackmatrix7:Line
    policy: HongKongSocial
    merge_group: HongKongSocial

# ============================================================
