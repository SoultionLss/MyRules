# ============================================================
# 分流规则配置文件
# ============================================================
#
# 【文件用途】
#   本文件定义需要拉取的所有规则源及其合并策略。
#   generate.py 会读取本文件，下载规则源，并根据 merge_group
#   字段决定是合并到合集还是作为独立源。
#
# 【字段说明】
#   match: 规则源标识，支持三种格式：
#          1. "来源名:规则名"（如 blackmatrix7:Google）
#             需在 sources.yaml 中定义对应的 URL 模板
#          2. 完整 URL（如 https://raw.githubusercontent.com/...）
#             直接使用该 URL 下载规则
#          3. 纯名称（如 Google）
#             自动尝试所有来源（不推荐，建议明确指定来源）
#
#   policy: 策略组名称
#           - 有 merge_group 时：指定合集名称和策略组名称
#           - 无 merge_group 时：指定独立源使用的策略组
#
#   merge_group: 可选字段，指定合并到哪个合集
#           - 有 merge_group: 该规则源合并到指定合集文件
#             例如 merge_group: AI 表示合并到 AI.list
#           - 无 merge_group: 该规则源作为独立源
#             例如 match: blackmatrix7:Google 生成 Google.list
#
# 【规则匹配优先级】
#   规则按从上到下的顺序匹配，越靠前优先级越高。
#   建议将最重要的规则放在前面（如 Google、AI 等）。
#
# 【输出说明】
#   - 合集文件: {平台}/{策略组}/{策略组}.{ext}
#     例: Surge/AI/AI.list
#   - 独立文件: {平台}/{策略组}/{源名称}.{ext}
#     例: Surge/AI/OpenAI.list
#
# ============================================================

# ============================================================
# 🧱 DNS 防泄露（优先级 1）
# ============================================================
# 说明：拦截 DNS 防泄露请求，防止 DNS 查询泄露隐私
# 状态：已注释，需要可取消注释
# - rule_set:
#     match: blackmatrix7:HTTPDNS
#     policy: REJECT
#     merge_group: REJECT

# ============================================================
# 🔍 谷歌服务（优先级 2）
# 说明：Google 全系列服务，含 Gemini，优先于 AI 规则
# 合集名：Google
# ============================================================
- rule_set:
    match: blackmatrix7:Google
    policy: Google
    merge_group: Google

- rule_set:
    match: blackmatrix7:Gemini
    policy: Google
    merge_group: Google

# ============================================================
# 🤖 AI 服务（优先级 3）
# 说明：OpenAI、Claude、Anthropic、Grok 等 AI 服务
# 合集名：AI
# ============================================================
- rule_set:
    match: blackmatrix7:OpenAI
    policy: AI
    merge_group: AI

- rule_set:
    match: blackmatrix7:Claude
    policy: AI
    merge_group: AI

- rule_set:
    match: blackmatrix7:Anthropic
    policy: AI
    merge_group: AI

- rule_set:
    match: https://raw.githubusercontent.com/funnyzak/network-rules/91d7339ab4e80883cf57dac518d4e92cd102003d/Surge/Rulesets/xAI.list
    policy: AI
    merge_group: AI

# ============================================================
# 📱 抖音服务（优先级 3.5）
# 说明：抖音国内服务，直连
# 来源：blackmatrix7:DouYin
# ============================================================
- rule_set:
    match: blackmatrix7:DouYin
    policy: DIRECT

# ============================================================
# 🎵 TikTok（优先级 4）
# 说明：TikTok 国际版服务
# 合集名：TikTok
