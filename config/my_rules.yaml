- rule_set:
    match: blackmatrix7:Microsoft
    policy: Microsoft
    merge_group: Microsoft

# 微软中国直连规则
- domain:
    match: cn.bing.com
    policy: DIRECT

- domain:
    match: '*.cn.bing.com'
    policy: DIRECT

