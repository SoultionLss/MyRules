# ============================================
# 高优先级：国内直连（白名单）
# ============================================
- rule_set:
    match: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    policy: DIRECT

- rule_set:
    match: https://cdn.jsdelivr.net/gh/xkww3n/Rules@main/Surge/China.list
    policy: DIRECT

- rule_set:
    match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/ChinaMax/ChinaMax.list
    policy: DIRECT

- rule_set:
    match: https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@master/surge/geosite-cn.txt
    policy: DIRECT

# ============================================
# 中优先级：广告拦截
# ============================================
- rule_set:
    match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Advertising/Advertising.list
    policy: REJECT

- rule_set:
    match: https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Advertising.list
    policy: REJECT

# ============================================
# 特殊应用分流
# ============================================
- rule_set:
    match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Google/Google.list
    policy: Google

- rule_set:
    match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/YouTube/YouTube.list
    policy: YouTube

- rule_set:
    match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/GitHub/GitHub.list
    policy: GitHub

- rule_set:
    match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Telegram/Telegram.list
    policy: Telegram

- rule_set:
    match: https://cdn.jsdelivr.net/gh/QuixoticHeart/rule-set@main/Surge/TikTok.list
    policy: TikTok

# AI

- rule_set:
    match: OpenAI
    policy: AI
    
- rule_set:
    match: Claude
    policy: AI

- rule_set:
    match: Anthropic
    policy: AI

- rule_set:
    match: xAI
    policy: AI

# =====================================
# 社交媒体
# =====================================
- rule_set:
    match: Instgram
    policy: Social

- rule_set:
    match: Threads
    policy: Social

- rule_set:
    match: Twitter
    policy: Social
    
- rule_set:
    match: Reddit
    policy: Social

# ==========================
# 流媒体
# ===========================
- rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Netflix/Netflix.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Disney/Disney.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/HBO/HBO.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/PrimeVideo/PrimeVideo.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Hulu/Hulu.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Peacock/Peacock.list
      policy: Streaming

  - rule_set:
      match: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Surge/Crunchyroll/Crunchyroll.list
      policy: Streaming

# ============================================
# 低优先级：国内 IP 段
# ============================================
- rule_set:
    match: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/geoip-cn.txt
    policy: DIRECT

# ============================================
# 默认策略
# ============================================
- default:
    policy: PROXY
