# ============================================================
# 分流规则配置文件
# 规则从上到下依次匹配，优先级逐行递减
#
# 【引用格式说明】
#   1. 简写格式: 来源名:规则名
#      示例: blackmatrix7:Google
#      说明: 从 sources.yaml 中查找对应来源的 URL 模板，将 {name} 替换为规则名
#      生成: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list
#
#   2. 完整 URL 格式: https://...
#      示例: https://raw.githubusercontent.com/.../xxx.list
#      说明: 直接使用该 URL 下载规则，不经过 sources.yaml 模板转换
#
#   3. separate: true
#      说明: 除了合并到策略组主文件外，额外生成独立的规则文件
#      示例: separate: true 时，会生成 OpenAI.list 作为独立文件
#
#   4. 策略组名 (policy)
#      说明: 规则匹配后使用的策略组名称，需在客户端配置中定义对应策略
# ============================================================

# ============================================================
# 🧱 DNS 防泄露（优先级 1）
# ============================================================
# 已注释，如需启用请取消注释
# - rule_set:
#     match: blackmatrix7:HTTPDNS
#     policy: REJECT
#     separate: true

# ============================================================
# 🔍 谷歌服务（优先级 2）- 含 Gemini，优先于 AI
# 来源: blackmatrix7/ios_rule_script
# 模板: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/{name}/{name}.list
# ============================================================
- rule_set:
    match: blackmatrix7:Google
    policy: Google
    separate: true

- rule_set:
    match: blackmatrix7:Gemini
    policy: Google
    separate: true

# ============================================================
# 🤖 AI 服务（优先级 3）
# 来源: blackmatrix7/ios_rule_script（OpenAI/Claude/Anthropic）
#       完整 URL: funnyzak/network-rules（xAI）
# ============================================================
- rule_set:
    match: blackmatrix7:OpenAI
    policy: AI
    separate: true

- rule_set:
    match: blackmatrix7:Claude
    policy: AI
    separate: true

- rule_set:
    match: blackmatrix7:Anthropic
    policy: AI
    separate: true

# xAI 规则（完整 URL，sources.yaml 中无对应来源）
# 来源: funnyzak/network-rules
# 注意: 请确认该文件是否存在，若 404 请改用 metacubex_geosite:openai
- rule_set:
